<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Obsidian luxury background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Studio status beacon -->
  <circle cx="51" cy="13" r="5" fill="#38bdf8" opacity="0.25" />
  <circle cx="51" cy="13" r="2.5" fill="#38bdf8" />

  <!-- DC Monogram -->
  <g filter="url(#glow)">
    <!-- Letter D -->
    <path
      d="M 14.5 19.5 H 20.5 C 26 19.5 29.5 23 29.5 32 C 29.5 41 26 44.5 20.5 44.5 H 14.5 Z"
      fill="none"
      stroke="url(#brandGrad)"
      stroke-width="5.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Letter C -->
    <path
      d="M 49.5 24.5 C 46.5 20 42.5 19.5 39.5 23 C 36 27 36 37 39.5 41 C 42.5 44.5 46.5 44 49.5 39.5"
      fill="none"
      stroke="url(#brandGrad)"
      stroke-width="5.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
